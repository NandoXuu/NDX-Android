name: Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygments
          python -m pip install buildozer==1.5.0 cython==0.29.36 pillow

      - name: Generate Android resources
        run: python tools/generate_assets.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Run UI smoke test
        run: python tools/ui_smoke_test.py

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Verify APK resources
        run: python tools/verify_apk_resources.py bin/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ndx-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
